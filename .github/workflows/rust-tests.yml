# The fast Rust tests: core, ticket check, relay, listing and host. No private chain, no browser, no network beyond
# fetching crates; the relay and listing tests talk only to servers they start on 127.0.0.1.
name: Rust tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (Rust ${{ matrix.rust }})
    strategy:
      fail-fast: false
      matrix:
        # stable, and the oldest version the crates build with (rust-version in app/Cargo.toml)
        rust: [stable, "1.89"]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # takes priority over rust-toolchain.toml, which names stable
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v7
      - name: Rust ${{ matrix.rust }}
        working-directory: .
        run: rustup toolchain install ${{ matrix.rust }} --profile minimal && rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app
          key: ${{ matrix.rust }}
      - name: Core, ticket check, relay, listing
        run: cargo test --locked -p ll-core -p ll-ticketcheck -p ll-relay -p ll-listing
      - name: Host
        run: cargo test --locked -p ll-host
