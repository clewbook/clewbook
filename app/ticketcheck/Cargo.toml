[package]
name = "ll-ticketcheck"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Checks a refund ticket the way the contributor's page does (SPEC §3.1). Shared by the WebAssembly page and native tests.
[dependencies]
hex.workspace = true
ll-core = { workspace = true, default-features = false }
serde.workspace = true
serde_json.workspace = true
zcash_protocol.workspace = true
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false, features = ["std"] }
orchard.workspace = true
