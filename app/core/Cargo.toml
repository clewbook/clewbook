[package]
name = "ll-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
default = ["walletdb"]
# Read-only access to a zcash_client_sqlite wallet database (not available in WebAssembly).
walletdb = ["dep:rusqlite"]

[dependencies]
anyhow.workspace = true
base64.workspace = true
blake2b_simd.workspace = true
crypto_box.workspace = true
ed25519-dalek.workspace = true
hex.workspace = true
rand_core.workspace = true
rusqlite = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
zcash_address.workspace = true
zcash_protocol.workspace = true
# Only to check that a refund receiver is a valid Orchard/Ironwood address (the same check the wallet makes when it pays it).
orchard.workspace = true
# The drand timelock for sealed bid auctions: a copy of tlock 0.0.10 that never panics on bad input (vendor/tlock, PATCHES.md).
tlock = { path = "../vendor/tlock" }
# The address of a transparent coin (HASH160 of a public key), for the sealed bid recount's coin check.
ripemd = "0.1"
sha2 = "0.10"
# The secret the host's payload key shares with a bid page's key (X25519), for the outgoing viewing key of each payment (payout.rs).
curve25519-dalek = "4.1"
