[package]
name = "ll-proofcheck"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# Level 3: verifies a ticket's zero-knowledge proof in the browser. Loaded lazily, in a worker, only when the person asks (app/web/www/proof-worker.js).
[lib]
crate-type = ["cdylib"]

[dependencies]
hex.workspace = true
orchard = { workspace = true, features = ["circuit"] }
zcash_primitives = { version = "=0.31.0", default-features = false, features = ["std"] }
zcash_protocol.workspace = true
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
