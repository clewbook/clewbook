[package]
name = "ll-proofmeasure"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

# MEASUREMENT ONLY (level 3, not integrated): builds the Orchard/Ironwood verifying key and verifies a ticket's proof in WebAssembly,
# to time it and size it. Built with app/proofmeasure/build.sh. Excluded from the default build.
[lib]
crate-type = ["cdylib"]

[dependencies]
hex.workspace = true
orchard = { workspace = true, features = ["circuit"] }
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false, features = ["std"] }
zcash_protocol.workspace = true
wasm-bindgen = "0.2"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
