[workspace]
members = ["core", "host", "contrib", "recount", "vectors", "web", "relay", "ticketcheck", "proofmeasure", "proofcheck", "listing"]
resolver = "2"
# ll-web is built only for wasm32 (app/web/build.sh); its library features differ from the native tools.
default-members = ["core", "host", "contrib", "recount", "vectors", "relay", "ticketcheck"]

[workspace.package]
edition = "2024"
rust-version = "1.89"
publish = false

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
blake2b_simd = "1"
clap = { version = "4", features = ["derive"] }
crypto_box = { version = "0.9", features = ["seal"] }
ed25519-dalek = "2.2"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

zcash_address = "=0.14.0"
zcash_protocol = "=0.11.0"
zcash_primitives = "=0.31.0"
pczt = { version = "=0.10.0", features = ["orchard", "prover", "signer", "spend-finalizer", "tx-extractor"] }
orchard = { version = "0.16", default-features = false }
rand = { version = "0.10", default-features = false, features = ["std", "sys_rng"] }

ll-core = { path = "core", default-features = false }
