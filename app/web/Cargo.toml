[package]
name = "ll-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow.workspace = true
hex.workspace = true
ll-core = { workspace = true, default-features = false }
ll-ticketcheck = { path = "../ticketcheck" }
serde.workspace = true
serde_json.workspace = true
zcash_protocol = { workspace = true, features = ["local-consensus"] }
zcash_primitives = { version = "=0.31.0-pre.0", default-features = false, features = ["std"] }
orchard.workspace = true
crypto_box.workspace = true
zcash_client_backend = { version = "=0.25.0-pre.0", default-features = false, features = ["orchard"] }
zcash_keys = { version = "=0.17.0-pre.0", default-features = false, features = ["orchard"] }
zcash_note_encryption = "0.5.1"
prost = "0.14"
zip32 = "0.3"
wasm-bindgen = "0.2"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
base64.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom02 = { package = "getrandom", version = "0.2", features = ["js"] }
getrandom03 = { package = "getrandom", version = "0.3", features = ["wasm_js"] }
getrandom04 = { package = "getrandom", version = "0.4", features = ["wasm_js"] }
