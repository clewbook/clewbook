[package]
name = "ll-contrib"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
anyhow.workspace = true
clap.workspace = true
hex.workspace = true
ll-core = { workspace = true, features = ["walletdb"] }
ll-relay = { path = "../relay" }
serde.workspace = true
serde_json.workspace = true
zcash_primitives.workspace = true
zcash_protocol.workspace = true
secp256k1 = "0.33"
zcash_address.workspace = true
ll-ticketcheck = { path = "../ticketcheck", features = ["proof"] }
orchard = { workspace = true, features = ["circuit"] }
incrementalmerkletree = "0.9"
crypto_box.workspace = true
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio = { version = "1", features = ["rt-multi-thread"] }
tonic = { version = "0.14", features = ["tls-webpki-roots"] }
zcash_client_backend = { version = "=0.25.0", features = ["lightwalletd-tonic-tls-webpki-roots", "orchard"] }

# the program is built under its new name and under the old one (the old name keeps working)
[[bin]]
name = "cb-contrib"
path = "src/main.rs"

[[bin]]
name = "ll-contrib"
path = "src/main.rs"
